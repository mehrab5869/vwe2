version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: proxy_admin
      POSTGRES_PASSWORD: proxy_pass
      POSTGRES_DB: proxy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://proxy_admin:proxy_pass@postgres:5432/proxy_db
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_SECRET_KEY=change-this-in-production-min-32-chars
      - ENCRYPTION_KEY=change-this-32-byte-key-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./admin-ui:/app
      - /app/node_modules

  user-dashboard:
    build:
      context: ./user-dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - PORT=3001
    depends_on:
      - backend
    volumes:
      - ./user-dashboard:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:

